<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexdoro — Pomodoro Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

      :root{
        --clay:#D97466;--sage:#8A9A86;
        --ink:#1F2124;--sub:#787870;--muted:#A8A89E;
        --bg:#F5F5F0;
        --glass:rgba(255,255,255,0.45);--glass-border:rgba(255,255,255,0.6);
        --r-xl:24px;--r-lg:16px;--r-md:10px;
        --ambient:0 4px 40px rgba(0,0,0,0.06),0 1px 6px rgba(0,0,0,0.03);
        --ambient-work:0 4px 40px rgba(217,116,102,0.12),0 1px 8px rgba(217,116,102,0.06);
        --ambient-break:0 4px 40px rgba(138,154,134,0.14),0 1px 8px rgba(138,154,134,0.06);
        --ease:cubic-bezier(0.4,0,0.2,1);
      }

      body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;overflow-x:hidden;position:relative;}

      .blob{position:fixed;border-radius:50%;pointer-events:none;opacity:0.35;z-index:0;filter:blur(70px);}
      .blob-1{width:420px;height:420px;background:radial-gradient(circle,#F0D9C8,#E8C4B8 40%,transparent 70%);top:-5%;left:-10%;animation:blobZen1 22s ease-in-out infinite;}
      .blob-2{width:380px;height:380px;background:radial-gradient(circle,#C8D8C4,#B0C8AC 40%,transparent 70%);bottom:0;right:-8%;animation:blobZen2 28s ease-in-out infinite;}
      .blob-3{width:300px;height:300px;background:radial-gradient(circle,#D4CCE0,#C0B4D0 40%,transparent 70%);top:45%;left:60%;animation:blobZen3 20s ease-in-out infinite;}

      @keyframes blobZen1{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-90px) scale(1.08);}}
      @keyframes blobZen2{0%,100%{transform:translateY(0) translateX(0);}40%{transform:translateY(-120px) translateX(-30px);}80%{transform:translateY(-50px) translateX(15px);}}
      @keyframes blobZen3{0%,100%{transform:translateY(0) scale(1);}60%{transform:translateY(-80px) scale(0.92);}}

      #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:380px;max-width:92vw;display:flex;flex-direction:column;gap:10px;z-index:9999;}
      .toast{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-radius:var(--r-lg);border:1px solid rgba(0,0,0,0.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:0.84rem;font-weight:600;line-height:1.5;color:var(--ink);background:rgba(255,255,255,0.8);box-shadow:0 4px 24px rgba(0,0,0,0.08);animation:tIn .38s var(--ease) both;}
      .toast.out{animation:tOut .28s ease both;}
      .toast-work{background:rgba(217,116,102,0.12);border-color:rgba(217,116,102,0.2);}
      .toast-break{background:rgba(138,154,134,0.12);border-color:rgba(138,154,134,0.2);}
      .toast-done{background:rgba(217,116,102,0.1);border-color:rgba(217,116,102,0.15);}
      .toast-info{background:rgba(255,255,255,0.85);border-color:rgba(0,0,0,0.06);}
      .toast-em{font-size:1.4rem;flex-shrink:0;line-height:1.2;}

      @keyframes tIn{from{opacity:0;transform:translateY(-20px) scale(.88);}to{opacity:1;transform:none;}}
      @keyframes tOut{from{opacity:1;}to{opacity:0;transform:translateY(-8px) scale(.92);}}

      .wrapper{position:relative;z-index:1;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;}

      h1.title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:2.3rem;color:var(--ink);margin-bottom:4px;letter-spacing:-0.5px;transition:opacity .4s;}
      .sub{font-size:0.68rem;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:22px;}

      .card{
        background:var(--glass);backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%);
        border:1px solid var(--glass-border);border-radius:var(--r-xl);
        box-shadow:var(--ambient);padding:34px 30px 26px;width:100%;
        transition:all .6s var(--ease);
      }
      /* Timer card: always frameless */
      #card{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:none!important;border-radius:0!important;box-shadow:none!important;animation:none!important;}
      #card.work,#card.break{background:transparent!important;border:none!important;box-shadow:none!important;}
      /* Mode-menu: also frameless */
      #mode-menu{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:none!important;border-radius:0!important;box-shadow:none!important;}

      @keyframes cardFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

      .badge-row{display:flex;justify-content:center;margin-bottom:18px;}
      .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 22px;border-radius:999px;border:1px solid rgba(0,0,0,0.06);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.82rem;background:rgba(0,0,0,0.04);color:var(--sub);letter-spacing:0.5px;transition:all .6s var(--ease);}
      .card.work .badge{background:rgba(217,116,102,0.12);color:var(--clay);border-color:rgba(217,116,102,0.25);}
      .card.break .badge{background:rgba(138,154,134,0.12);color:var(--sage);border-color:rgba(138,154,134,0.25);}

      .timer-wrap{text-align:center;}
      .timer{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:5.5rem;line-height:1;color:var(--ink);letter-spacing:-2px;transition:color .6s var(--ease);}
      .card.work .timer{color:var(--clay);}
      .card.break .timer{color:var(--sage);}
      .timer-lbl{font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin:5px 0 16px;}

      .prog-track{height:2px;background:rgba(0,0,0,0.04);border-radius:999px;border:none;overflow:hidden;margin-bottom:18px;opacity:0;transition:opacity .4s;}
      .card.break .prog-track{opacity:1;}
      .prog-fill{height:100%;border-radius:999px;width:100%;transition:width 1s linear;}

      .motivasi{background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.05);border-radius:var(--r-lg);padding:16px 20px;text-align:center;font-size:0.82rem;font-weight:500;line-height:1.6;margin-bottom:22px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:all .6s var(--ease);}
      .card.work .motivasi{background:rgba(217,116,102,0.05);border-color:rgba(217,116,102,0.1);}
      .card.break .motivasi{background:rgba(138,154,134,0.05);border-color:rgba(138,154,134,0.1);}

      .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
      .stat{background:transparent;border:none;border-radius:var(--r-md);padding:10px 6px;text-align:center;}
      .stat-v{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.2rem;color:var(--ink);line-height:1;}
      .stat-l{font-size:0.62rem;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:4px;display:block;}

      .btns{display:flex;flex-direction:column;gap:10px;}
      .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 24px;border:none;border-radius:var(--r-md);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;width:100%;background:rgba(0,0,0,0.04);color:var(--ink);transition:all .3s var(--ease);letter-spacing:0.3px;box-shadow:none;}
      .btn:hover{background:rgba(0,0,0,0.07);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.06);}
      .btn:active{transform:translateY(1px);box-shadow:none!important;}
      .btn-start{background:var(--clay);color:#fff;}
      .btn-start:hover{background:#c4685b;box-shadow:0 4px 20px rgba(217,116,102,0.2);}
      .btn-finish{background:rgba(217,116,102,0.1);color:var(--clay);}
      .btn-finish:hover{background:rgba(217,116,102,0.18);}
      .btn-skip{background:rgba(138,154,134,0.12);color:var(--sage);}
      .btn-skip:hover{background:rgba(138,154,134,0.2);}
      .btn-reset{background:transparent;color:var(--muted);font-size:0.82rem;padding:11px;}
      .btn-reset:hover{color:var(--sub);background:rgba(0,0,0,0.03);}
      .btn-back{background:transparent;color:var(--muted);font-size:0.82rem;padding:11px;}
      .btn-back:hover{color:var(--sub);background:rgba(0,0,0,0.03);}

      @keyframes pop{0%{transform:scale(.85);}60%{transform:scale(1.05);}100%{transform:scale(1);}}
      @keyframes wiggle{0%,100%{transform:rotate(0);}25%{transform:rotate(-3deg);}75%{transform:rotate(3deg);}}
      .pop{animation:pop .4s var(--ease);}
      .wiggle{animation:wiggle .4s ease;}

      .mode-menu{text-align:center;}
      .mode-subtitle{font-size:0.82rem;font-weight:500;color:var(--sub);margin-bottom:28px;letter-spacing:0.3px;}
      .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}

      .mode-card{
        background:transparent;border:none;border-radius:20px;
        padding:32px 18px 26px;cursor:pointer;display:flex;flex-direction:column;
        align-items:center;gap:12px;transition:all .45s var(--ease);
        font-family:inherit;color:var(--ink);position:relative;overflow:hidden;
      }
      /* Subtle gradient underline accent */
      .mode-card::after{
        content:'';position:absolute;bottom:12px;left:50%;transform:translateX(-50%) scaleX(0);
        width:40px;height:2.5px;border-radius:99px;
        background:linear-gradient(90deg,var(--clay),var(--sage));
        transition:transform .4s var(--ease),opacity .4s;opacity:0;
      }
      .mode-card:hover::after{transform:translateX(-50%) scaleX(1);opacity:1;}
      .mode-card:hover{
        transform:translateY(-6px);
      }
      .mode-card:active{transform:translateY(0) scale(0.97);}

      .mode-icon{
        font-size:2rem;line-height:1;width:56px;height:56px;
        display:flex;align-items:center;justify-content:center;border-radius:16px;
        background:rgba(0,0,0,0.025);
        transition:all .45s var(--ease);position:relative;
      }
      .mode-card:hover .mode-icon{
        background:linear-gradient(135deg,rgba(217,116,102,0.1),rgba(138,154,134,0.08));
        transform:scale(1.1) translateY(-2px);
        box-shadow:0 8px 24px rgba(217,116,102,0.1);
      }
      .mode-name{font-weight:800;font-size:0.9rem;color:var(--ink);letter-spacing:-0.2px;position:relative;z-index:1;transition:color .3s var(--ease);}
      .mode-card:hover .mode-name{color:var(--clay);}
      .mode-desc{font-size:0.66rem;font-weight:500;color:var(--muted);line-height:1.4;position:relative;z-index:1;transition:color .3s var(--ease);}
      .mode-card:hover .mode-desc{color:var(--sub);}
      /* === MODAL OVERLAY === */
      .modal-overlay{
        position:fixed;inset:0;z-index:8000;display:flex;align-items:center;justify-content:center;
        background:rgba(0,0,0,0.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
      }
      .modal-overlay.active{opacity:1;pointer-events:auto;}
      .modal-content{
        background:rgba(255,255,255,0.88);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
        border:1px solid rgba(255,255,255,0.7);border-radius:22px;
        box-shadow:0 20px 60px rgba(0,0,0,0.12),0 2px 12px rgba(0,0,0,0.06);
        padding:36px 32px 28px;width:380px;max-width:90vw;
        transform:scale(0.9) translateY(20px);transition:transform .4s var(--ease);
      }
      .modal-overlay.active .modal-content{transform:scale(1) translateY(0);}
      .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
      .modal-title{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1rem;color:var(--ink);letter-spacing:-0.3px;}
      .modal-close{
        width:32px;height:32px;border-radius:10px;border:none;background:rgba(0,0,0,0.04);
        color:var(--muted);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
        transition:all .25s var(--ease);font-family:'Plus Jakarta Sans',sans-serif;
      }
      .modal-close:hover{background:rgba(0,0,0,0.08);color:var(--ink);transform:scale(1.08);}
      .modal-subtitle{font-size:0.72rem;font-weight:500;color:var(--sub);margin-bottom:22px;text-align:center;}
      .custom-inputs{display:flex;gap:12px;margin-bottom:18px;}
      .custom-field{flex:1;text-align:left;}
      .custom-field label{display:block;font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px;}
      .custom-field input{width:100%;padding:12px 14px;border:1px solid rgba(0,0,0,0.07);border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1.15rem;text-align:center;color:var(--ink);background:rgba(0,0,0,0.02);outline:none;transition:all .25s var(--ease);}
      .custom-field input:focus{border-color:rgba(217,116,102,0.4);box-shadow:0 0 0 4px rgba(217,116,102,0.08);background:#fff;}
      .modal-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;background:var(--clay);color:#fff;transition:all .3s var(--ease);margin-top:6px;}
      .modal-btn:hover{background:#c4685b;transform:translateY(-1px);box-shadow:0 6px 24px rgba(217,116,102,0.2);}
      .modal-btn:active{transform:translateY(1px);box-shadow:none;}

      .card.work.countdown .prog-track{opacity:1;}
      .card.work .prog-fill{background:var(--clay);}
      .card.break .prog-fill{background:var(--sage);}

      .fade-in{animation:fadeIn .45s var(--ease) both;}
      @keyframes fadeIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}

      /* ========== FOCUS MODE — FRAMELESS IMMERSIVE ========== */
      #focus-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
      #focus-bg .bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s var(--ease);}
      #focus-bg .bg-work{background-image:url('gambar1.jpg');}
      #focus-bg .bg-break{background-image:url('gambar2.jpg');}
      #focus-bg .bg-layer.active{opacity:1;}
      #focus-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.4) 100%);opacity:0;transition:opacity 1s var(--ease);pointer-events:none;}
      body.focus-mode-active #focus-bg::after{opacity:1;}

      /* === IDLE CARD: also frameless when timer card is visible === */
      #card{transition:all .6s var(--ease);}

      /* === ACTIVE: hide chrome, go frameless === */
      body.focus-mode-active .title,
      body.focus-mode-active .sub,
      body.focus-mode-active .blob{opacity:0;pointer-events:none;transition:opacity .8s var(--ease);}

      body.focus-mode-active{padding:0;}

      body.focus-mode-active .wrapper{
        max-width:680px;min-height:100vh;justify-content:center;
        padding:40px 24px;transition:all .6s var(--ease);
      }

      /* Card: completely invisible, no bg/border/shadow/padding */
      body.focus-mode-active #card{
        background:transparent!important;border:none!important;
        box-shadow:none!important;backdrop-filter:none!important;
        -webkit-backdrop-filter:none!important;animation:none!important;
        padding:0!important;border-radius:0!important;
      }

      /* Badge: frosted glass pill */
      body.focus-mode-active .badge{
        background:rgba(255,255,255,0.1)!important;
        border-color:rgba(255,255,255,0.18)!important;
        color:rgba(255,255,255,0.8)!important;
        backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        font-size:0.78rem;letter-spacing:0.8px;
        transition:all .6s var(--ease);
      }

      /* TIMER: giant crisp white, perfectly centered */
      body.focus-mode-active .timer{
        font-size:9rem!important;color:#fff!important;
        text-shadow:0 4px 60px rgba(0,0,0,0.25);
        letter-spacing:-4px;font-weight:800;
        transition:font-size .6s var(--ease),color .8s var(--ease),text-shadow .8s var(--ease);
      }
      body.focus-mode-active .timer-lbl{
        color:rgba(255,255,255,0.45)!important;
        font-size:0.6rem;letter-spacing:4px;
        transition:color .6s var(--ease);
      }

      /* Progress: ultra-thin white line */
      body.focus-mode-active .prog-track{background:rgba(255,255,255,0.08)!important;height:2px;margin-bottom:24px;}
      body.focus-mode-active .prog-fill{background:rgba(255,255,255,0.5)!important;box-shadow:0 0 8px rgba(255,255,255,0.15)!important;}

      /* Motivasi: subtle, smaller, no border */
      body.focus-mode-active .motivasi{
        background:transparent!important;border:none!important;
        color:rgba(255,255,255,0.5)!important;
        font-size:0.78rem;font-weight:400;font-style:italic;
        padding:12px 0;margin-bottom:28px;min-height:auto;
        transition:all .6s var(--ease);
      }

      /* Stats: compact horizontal strip */
      body.focus-mode-active .stats{
        gap:6px;margin-bottom:16px;
      }
      body.focus-mode-active .stats .stat{
        background:rgba(255,255,255,0.06)!important;
        border:1px solid rgba(255,255,255,0.08)!important;
        border-radius:8px;padding:8px 4px;
        backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      }
      body.focus-mode-active .stat-v{color:rgba(255,255,255,0.85)!important;font-size:1.05rem;}
      body.focus-mode-active .stat-l{color:rgba(255,255,255,0.35)!important;font-size:0.58rem;letter-spacing:2px;}

      /* Buttons: ghost-style, no solid fill */
      body.focus-mode-active .btns{gap:8px;}
      body.focus-mode-active .btn{
        background:rgba(255,255,255,0.07)!important;
        color:rgba(255,255,255,0.75)!important;
        border:1px solid rgba(255,255,255,0.1)!important;
        border-radius:10px;font-size:0.88rem;padding:13px 20px;
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        transition:all .3s var(--ease);
      }
      body.focus-mode-active .btn:hover{
        background:rgba(255,255,255,0.14)!important;
        border-color:rgba(255,255,255,0.2)!important;
        transform:translateY(-1px);
      }
      body.focus-mode-active .btn-finish,
      body.focus-mode-active .btn-start{
        background:rgba(255,255,255,0.14)!important;
        color:#fff!important;border-color:rgba(255,255,255,0.22)!important;
      }
      body.focus-mode-active .btn-finish:hover,
      body.focus-mode-active .btn-start:hover{background:rgba(255,255,255,0.22)!important;}
      body.focus-mode-active .btn-skip{
        background:rgba(255,255,255,0.08)!important;
        color:rgba(255,255,255,0.8)!important;
      }
      body.focus-mode-active .btn-reset,
      body.focus-mode-active .btn-back{
        background:transparent!important;
        color:rgba(255,255,255,0.35)!important;
        border-color:transparent!important;font-size:0.8rem;
      }
      body.focus-mode-active .btn-reset:hover,
      body.focus-mode-active .btn-back:hover{color:rgba(255,255,255,0.6)!important;}

      @media(max-width:520px){
        body.focus-mode-active .timer{font-size:5.5rem!important;letter-spacing:-2px;}
        body.focus-mode-active .wrapper{padding:24px 16px;}
      }
    </style>
  </head>
  <body>
    <!-- Focus-mode background layers -->
    <div id="focus-bg">
      <div class="bg-layer bg-work"></div>
      <div class="bg-layer bg-break"></div>
    </div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div id="toasts"></div>

    <div class="wrapper">
      <h1 class="title">🤓 Flexdoro</h1>
      <p class="sub">Custom Pomodoro Timer</p>

      <!-- MODE SELECTION MENU -->
      <div class="card mode-menu fade-in" id="mode-menu">
        <div class="badge-row"><div class="badge"> <span>Pilih Mode</span></div></div>
        <p class="mode-subtitle">Mau pake mode apa?</p>
        <div class="mode-grid">
          <button class="mode-card" onclick="selectMode('reymond')">
            <span class="mode-icon">😎</span>
            <span class="mode-name">Reymond Style</span>
            <span class="mode-desc">Ini Stopwatch, tapi di pomodoroin</span>
          </button>
          <button class="mode-card" onclick="pickPreset('50/10')">
            <span class="mode-icon">📚</span>
            <span class="mode-name">Mode 50/10</span>
            <span class="mode-desc">50 min kerja, 10 min istirahat</span>
          </button>
          <button class="mode-card" onclick="pickPreset('25/5')">
            <span class="mode-icon">📝</span>
            <span class="mode-name">Mode 25/5</span>
            <span class="mode-desc">25 min kerja, 5 min istirahat</span>
          </button>
          <button class="mode-card" onclick="showCustomForm()">
            <span class="mode-icon">😴</span>
            <span class="mode-name">Custom</span>
            <span class="mode-desc">Bebas bos, atur sendiri</span>
          </button>
        </div>

        <div class="stats" id="menu-stats">
          <div class="stat"><span class="stat-v" id="msv-sess">0</span><span class="stat-l">Sesi Selesai</span></div>
          <div class="stat"><span class="stat-v" id="msv-work">0:00</span><span class="stat-l">Total Kerja</span></div>
          <div class="stat"><span class="stat-v" id="msv-break">0:00</span><span class="stat-l">Istirahat</span></div>
        </div>
      </div>

      <div class="card" id="card" style="display:none">
        <div class="badge-row">
          <div class="badge" id="badge">
            <span id="bicon">😴</span>
            <span id="btext">Siap Mulai</span>
          </div>
        </div>

        <div class="timer-wrap">
          <span class="timer" id="timer">00:00</span>
          <div class="timer-lbl" id="tlbl">Belum mulai · tekan mulai kerja</div>
        </div>

        <div class="prog-track" id="prog-track">
          <div class="prog-fill" id="prog-fill"></div>
        </div>

        <div class="motivasi" id="motivasi">
          💤 Kalau udah siap pilih "Mulai Kerja" ya
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-v" id="sv-sess">0</span
            ><span class="stat-l">Sesi Selesai</span>
          </div>
          <div class="stat">
            <span class="stat-v" id="sv-work">0:00</span
            ><span class="stat-l">Total Kerja</span>
          </div>
          <div class="stat">
            <span class="stat-v" id="sv-break">0:00</span
            ><span class="stat-l">Istirahat</span>
          </div>
        </div>

        <div class="btns" id="btns"></div>
      </div>
    </div>

    <!-- SESSION INPUT MODAL -->
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-title" id="modal-title">Mode 50/10</span>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <p class="modal-subtitle" id="modal-subtitle">50 min kerja, 10 min istirahat</p>

        <!-- Preset session form -->
        <div id="session-form" style="display:none">
          <div class="custom-inputs">
            <div class="custom-field">
              <label>Jumlah Sesi</label>
              <input type="number" id="preset-sessions" min="1" max="20" value="4">
            </div>
          </div>
          <button class="modal-btn" onclick="submitPreset()">▶ Mulai</button>
        </div>

        <!-- Custom form -->
        <div id="custom-form" style="display:none">
          <div class="custom-inputs">
            <div class="custom-field">
              <label>Kerja (menit)</label>
              <input type="number" id="custom-work" min="1" max="120" value="30">
            </div>
            <div class="custom-field">
              <label>Istirahat (menit)</label>
              <input type="number" id="custom-break" min="1" max="60" value="10">
            </div>
          </div>
          <div class="custom-inputs">
            <div class="custom-field">
              <label>Jumlah Sesi</label>
              <input type="number" id="custom-sessions" min="1" max="20" value="4">
            </div>
          </div>
          <button class="modal-btn" onclick="submitCustom()">✔ Mulai Custom</button>
        </div>
      </div>
    </div>

    <script>
      const BREAK_RATIO = 0.28;
      const M_IDLE = [
        ["","Learning never exhausts the mind.<br>— Leonardo da Vinci"],
        ["","The only true wisdom is in knowing you know nothing.<br>— Socrates"],
        ["","Continuous improvement is better than delayed perfection.<br>— Mark Twain"],
        ["","Live as if you were to die tomorrow. Learn as if you were to live forever.<br>— Mahatma Gandhi"],
      ];
      const M_WORK = [
        ["","Genius is one percent inspiration and ninety-nine percent perspiration.<br>— Thomas Edison"],
        ["","The roots of education are bitter, but the fruit is sweet.<br>— Aristotle"],
        ["","The only way to do great work is to love what you do.<br>— Steve Jobs"],
        ["","It does not matter how slowly you go as long as you do not stop.<br>— Confucius"],
        ["","What I cannot create, I do not understand.<br>— Richard Feynman"],
        ["","The beginning is the most important part of the work.<br>— Plato"],
        ["","Nothing will work unless you do.<br>— Maya Angelou"],
      ];
      const M_BREAK = [
        ["","Those who can imagine anything, can create the impossible.<br>— Alan Turing"],
        ["","Anyone who stops learning is old, whether at twenty or eighty.<br>— Henry Ford"],
        ["","The only way out is through.<br>— Robert Frost"],
        ["","Knowing is not enough; we must apply. Willing is not enough; we must do.<br>— Johann Wolfgang von Goethe"],
        ["","Focus on being productive instead of busy.<br>— Tim Ferriss"],
      ];
      const T_WORK = [
        ["","Simplicity is the ultimate sophistication.<br>— Leonardo da Vinci","toast-work"],
        ["","The more I learn, the more I realize how much I don't know.<br>— Albert Einstein","toast-work"],
        ["","Action is the foundational key to all success.<br>— Pablo Picasso","toast-work"],
        ["","Intelligence is the ability to adapt to change.<br>— Stephen Hawking","toast-work"],
        ["","Discipline is the bridge between goals and accomplishment.<br>— Jim Rohn","toast-work"],
      ];
      const T_DONE = [
        ["","Study sprint complete. Give your brain a break.","toast-done"],
        ["","Learning block cleared. Time to step away from the screen.","toast-done"],
        ["","Knowledge locked in. Enjoy your well-earned rest.","toast-done"],
        ["","Brain power fully deployed. Time to reset.","toast-done"],
        ["","Solid learning session. Your mind deserves this pause.","toast-done"],
      ];

      // === STATE ===
      let timerMode = null;
      let workDuration = 0, breakDuration = 0;
      let workLeft = 0;
      let targetSessions = 0; // 0 = unlimited (Reymond)
      let currentSession = 0; // current session within the run
      let state = "idle", workS = 0, brkTotal = 0, brkLeft = 0;
      let tickId = null, motId = null;
      let sessions = 0, totalWork = 0, totalBreak = 0;
      let startTime = 0, endTime = 0;

      function fmt(s) {
        return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
      }
      function fmtS(s) {
        return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
      }
      function rnd(a) { return a[Math.floor(Math.random()*a.length)]; }
      function isCountdown() { return timerMode && timerMode !== 'reymond'; }

      function toast(em,tx,cls,dur) {
        dur=dur||4500;
        const c=document.getElementById("toasts"), d=document.createElement("div");
        d.className="toast "+(cls||"toast-info");
        d.innerHTML='<span class="toast-em">'+em+"</span><span>"+tx+"</span>";
        c.appendChild(d);
        setTimeout(()=>{d.classList.add("out");setTimeout(()=>d.remove(),300);},dur);
      }

      function setMotivasi(arr) {
        clearInterval(motId);
        const el=document.getElementById("motivasi");
        const show=()=>{const[e,t]=rnd(arr);el.style.opacity="0";setTimeout(()=>{el.innerHTML=e+" "+t;el.style.opacity="1";},220);};
        el.style.transition="opacity 0.22s, background 0.4s";
        show(); motId=setInterval(show,13000);
      }

      function animT(type) {
        const el=document.getElementById("timer");
        el.classList.remove("pop","wiggle"); void el.offsetWidth; el.classList.add(type);
      }

      // === MODE SELECTION ===
      let pendingPreset = null; // temp store for preset mode before session input

      function selectMode(mode) {
        // Only Reymond enters directly (no session input)
        timerMode = mode;
        workDuration=0; breakDuration=0; targetSessions=0; currentSession=0;
        document.getElementById('mode-menu').style.display='none';
        document.getElementById('session-form').style.display='none';
        document.getElementById('custom-form').style.display='none';
        const card=document.getElementById('card');
        card.style.display=''; card.classList.add('fade-in');
        setTimeout(()=>card.classList.remove('fade-in'),400);
        render();
      }

      function openModal() {
        const m=document.getElementById('modal-overlay');
        m.classList.add('active');
      }
      function closeModal() {
        const m=document.getElementById('modal-overlay');
        m.classList.remove('active');
      }

      function pickPreset(mode) {
        pendingPreset = mode;
        const title = mode==='50/10' ? 'Mode 50/10' : 'Mode 25/5';
        const sub = mode==='50/10' ? '50 min kerja, 10 min istirahat' : '25 min kerja, 5 min istirahat';
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-subtitle').textContent = sub;
        document.getElementById('session-form').style.display='';
        document.getElementById('custom-form').style.display='none';
        openModal();
      }

      function submitPreset() {
        const ns=Math.max(1,Math.min(20,parseInt(document.getElementById('preset-sessions').value)||1));
        timerMode=pendingPreset;
        if (pendingPreset==='50/10') { workDuration=50*60; breakDuration=10*60; }
        else { workDuration=25*60; breakDuration=5*60; }
        targetSessions=ns; currentSession=0;
        closeModal();
        document.getElementById('mode-menu').style.display='none';
        const card=document.getElementById('card');
        card.style.display=''; card.classList.add('fade-in');
        setTimeout(()=>card.classList.remove('fade-in'),400);
        render();
      }

      function showCustomForm() {
        document.getElementById('modal-title').textContent = 'Custom Mode';
        document.getElementById('modal-subtitle').textContent = 'Atur durasi kerja, istirahat, dan jumlah sesi';
        document.getElementById('custom-form').style.display='';
        document.getElementById('session-form').style.display='none';
        openModal();
      }

      function submitCustom() {
        const wm=Math.max(1,Math.min(120,parseInt(document.getElementById('custom-work').value)||1));
        const bm=Math.max(1,Math.min(60,parseInt(document.getElementById('custom-break').value)||1));
        const ns=Math.max(1,Math.min(20,parseInt(document.getElementById('custom-sessions').value)||1));
        timerMode='custom'; workDuration=wm*60; breakDuration=bm*60;
        targetSessions=ns; currentSession=0;
        closeModal();
        document.getElementById('mode-menu').style.display='none';
        const card=document.getElementById('card');
        card.style.display=''; card.classList.add('fade-in');
        setTimeout(()=>card.classList.remove('fade-in'),400);
        render();
      }

      function showModeMenu() {
        if (state!=='idle') return;
        timerMode=null; currentSession=0; targetSessions=0;
        closeModal();
        document.getElementById('card').style.display='none';
        const mm=document.getElementById('mode-menu');
        mm.style.display=''; mm.classList.add('fade-in');
        setTimeout(()=>mm.classList.remove('fade-in'),400);
        updateMenuStats();
      }

      function updateMenuStats() {
        document.getElementById('msv-sess').textContent=sessions;
        document.getElementById('msv-work').textContent=fmtS(totalWork);
        document.getElementById('msv-break').textContent=fmtS(totalBreak);
      }

      // === RENDER ===
      let resetPending=false; // two-step reset state

      function render() {
        const card=document.getElementById("card");
        const cd=isCountdown();
        card.className="card "+state+(cd&&state==="work"?" countdown":"");

      // Badge — show session counter
        document.getElementById("bicon").textContent=state==="work"?"🔥":state==="break"?"☕":"😴";
        if (isCountdown() && targetSessions>0) {
          // Countdown with session target: "Sesi 2/4 · Kerja"
          const sn = state==="work" ? currentSession : currentSession;
          const label = state==="work" ? "Kerja" : state==="break" ? "Istirahat" : "Siap";
          document.getElementById("btext").textContent="Sesi "+sn+"/"+targetSessions+" · "+label;
        } else {
          // Reymond: no session count
          document.getElementById("btext").textContent=state==="work"?"Mode Kerja":state==="break"?"Mode Istirahat":"Siap Mulai";
        }

        if (state==="work") {
          document.getElementById("timer").textContent=cd?fmt(workLeft):fmt(workS);
        } else if (state==="break") {
          document.getElementById("timer").textContent=fmt(brkLeft);
        } else {
          document.getElementById("timer").textContent=cd?fmt(workDuration):"00:00";
        }

        document.getElementById("tlbl").textContent=
          state==="work"?(cd?"Hitung mundur kerja ▼":"Stopwatch kerja berjalan ▲")
          :state==="break"?"Hitung mundur istirahat ▼":"Belum mulai · tekan mulai kerja";

        if (cd && state==="work") {
          const pct=workDuration>0?(workLeft/workDuration)*100:100;
          document.getElementById("prog-fill").style.width=pct+"%";
        } else if (state==="break") {
          const pct=brkTotal>0?(brkLeft/brkTotal)*100:0;
          document.getElementById("prog-fill").style.width=pct+"%";
        }

        document.getElementById("sv-sess").textContent=sessions;
        document.getElementById("sv-work").textContent=fmtS(totalWork);
        document.getElementById("sv-break").textContent=fmtS(totalBreak);

        resetPending=false; // reset two-step state on any render
        const btns=document.getElementById("btns");
        if (state==="idle") {
          let h='<button class="btn btn-start" onclick="startWork()">▶ Mulai Kerja</button>';
          h+='<button class="btn btn-back" onclick="showModeMenu()">⬅ Ganti Mode</button>';
          if (sessions>0) h+='<button class="btn btn-reset" onclick="confirmReset(this)">↺ Reset Semua</button>';
          btns.innerHTML=h;
        } else if (state==="work") {
          const lbl=cd?'✔ Selesai Lebih Awal':'✔ Selesai Kerja — Ambil Istirahat!';
          btns.innerHTML='<button class="btn btn-finish" onclick="finishWork()">'+lbl+'</button>'+
            '<button class="btn btn-back" onclick="stopSession()">⏹ Berhenti Sesi</button>'+
            '<button class="btn btn-reset" onclick="confirmReset(this)">↺ Reset Semua</button>';
        } else {
          btns.innerHTML='<button class="btn btn-skip" onclick="finishBreak()">⏭ Selesai Istirahat (skip)</button>'+
            '<button class="btn btn-back" onclick="stopSession()">⏹ Berhenti Sesi</button>'+
            '<button class="btn btn-reset" onclick="confirmReset(this)">↺ Reset Semua</button>';
        }
      }

      // === TIMER CORE ===
      function setFocusBg(mode) {
        const work=document.querySelector('#focus-bg .bg-work');
        const brk=document.querySelector('#focus-bg .bg-break');
        work.classList.toggle('active', mode==='work');
        brk.classList.toggle('active', mode==='break');
        if (mode) {
          document.body.classList.add('focus-mode-active');
        } else {
          document.body.classList.remove('focus-mode-active');
        }
      }

      function startWork() {
        if (state!=="idle") return;
        state="work";
        if (isCountdown()) currentSession++;
        const[e,t,c]=rnd(T_WORK); toast(e,t,c,4500);
        setMotivasi(M_WORK);
        setFocusBg('work');

        if (!isCountdown()) {
          // REYMOND — stopwatch count-up
          workS=0; startTime=Date.now();
          tickId=setInterval(()=>{
            workS=Math.floor((Date.now()-startTime)/1000);
            document.getElementById("timer").textContent=fmt(workS);
          },500);
        } else {
          // COUNTDOWN
          workLeft=workDuration; startTime=Date.now();
          endTime=Date.now()+workDuration*1000;
          document.getElementById("prog-fill").style.transition="none";
          document.getElementById("prog-fill").style.width="100%";
          tickId=setInterval(()=>{
            workLeft=Math.max(0,Math.floor((endTime-Date.now())/1000));
            document.getElementById("timer").textContent=fmt(workLeft);
            const pct=workDuration>0?(workLeft/workDuration)*100:0;
            document.getElementById("prog-fill").style.transition="width 1s linear";
            document.getElementById("prog-fill").style.width=pct+"%";
            if (workLeft<=0) { clearInterval(tickId); finishWork(); return; }
          },500);
        }
        animT("pop"); render();
      }

      function finishWork() {
        if (state!=="work") return;
        clearInterval(tickId);

        if (!isCountdown()) {
          totalWork+=workS; sessions++;
          brkTotal=Math.round(workS*BREAK_RATIO);
        } else {
          const actual=workDuration-workLeft;
          totalWork+=actual; sessions++;
          brkTotal=breakDuration;
        }
        totalBreak+=brkTotal;
        brkLeft=brkTotal;

        if (brkTotal<=0) { state="idle"; setMotivasi(M_IDLE); render(); return; }

        state="break";
        setFocusBg('break');
        endTime=Date.now()+brkTotal*1000;
        document.getElementById("prog-fill").style.transition="none";
        document.getElementById("prog-fill").style.width="100%";

        const wkDisplay=isCountdown()?fmt(workDuration-workLeft):fmt(workS);
        toast("☕","Kerja "+wkDisplay+" → istirahat "+fmt(brkTotal)+". Nikmati jedanya!","toast-break",5000);
        setMotivasi(M_BREAK);

        tickId=setInterval(()=>{
          brkLeft=Math.floor((endTime-Date.now())/1000);
          if (brkLeft<=0) {
            brkLeft=0; document.getElementById("timer").textContent=fmt(0);
            clearInterval(tickId); brkOver(); return;
          }
          document.getElementById("timer").textContent=fmt(brkLeft);
          const pct=brkTotal>0?(brkLeft/brkTotal)*100:0;
          document.getElementById("prog-fill").style.transition="width 1s linear";
          document.getElementById("prog-fill").style.width=pct+"%";
        },500);
        animT("pop"); render();
      }

      function finishBreak() {
        if (state!=="break") return;
        clearInterval(tickId); brkOver();
      }

      function brkOver() {
        state="idle";
        // Countdown with sessions: auto-continue if more sessions remain
        if (isCountdown() && targetSessions>0 && currentSession<targetSessions) {
          animT("wiggle");
          toast("🔄","Istirahat selesai! Sesi "+(currentSession+1)+"/"+targetSessions+" dimulai.","toast-done",4000);
          startWork();
          return;
        }
        // All sessions done OR Reymond mode: go to idle
        if (isCountdown() && targetSessions>0 && currentSession>=targetSessions) {
          toast("🎉","Semua "+targetSessions+" sesi selesai! Keren banget!","toast-done",6000);
        } else {
          const[e,t,c]=rnd(T_DONE); toast(e,t,c,5500);
        }
        setFocusBg(null);
        setMotivasi(M_IDLE); animT("wiggle"); render();
      }

      function stopSession() {
        clearInterval(tickId);
        state="idle";
        currentSession=targetSessions; // prevent auto-resume
        setFocusBg(null);
        setMotivasi(M_IDLE); animT("wiggle"); render();
      }

      // Two-step reset: first click = confirm, second click = reset
      function confirmReset(btn) {
        if (resetPending) {
          resetAll();
          return;
        }
        resetPending=true;
        btn.textContent='⚠ Yakin Reset?';
        btn.style.background='var(--red)';
        btn.style.color='#fff';
        btn.style.borderColor='var(--ink)';
        btn.style.boxShadow='var(--shadow-sm)';
        setTimeout(()=>{
          if (resetPending) {
            resetPending=false;
            btn.textContent='↺ Reset Semua';
            btn.style.background=''; btn.style.color=''; btn.style.borderColor=''; btn.style.boxShadow='';
          }
        },3000);
      }

      function resetAll() {
        clearInterval(tickId); clearInterval(motId);
        state="idle"; workS=0; brkTotal=0; brkLeft=0; workLeft=0;
        sessions=0; totalWork=0; totalBreak=0;
        timerMode=null; targetSessions=0; currentSession=0;
        resetPending=false;
        setFocusBg(null);
        closeModal();
        document.getElementById('card').style.display='none';
        const mm=document.getElementById('mode-menu');
        mm.style.display=''; mm.classList.add('fade-in');
        setTimeout(()=>mm.classList.remove('fade-in'),400);
        setMotivasi(M_IDLE); updateMenuStats();
      }

      // =============================================
      // AUDIO ENGINE — MP3 file-based sounds
      // =============================================
      const sndAirplane = new Audio('airplane.mp3');
      const sndClock = new Audio('clock-sound.mp3');
      sndAirplane.preload = 'auto';
      sndClock.preload = 'auto';

      function playSound(audio) {
        audio.currentTime = 0;
        audio.play().catch(()=>{/* blocked by autoplay policy — silent */});
      }

      // =============================================
      // PATCH: inject sound calls into actions
      // =============================================
      const _startWork = startWork;
      const _finishWork = finishWork;
      const _brkOver = brkOver;

      startWork = function () {
        // Sesi pertama → airplane.mp3, sesi selanjutnya → clock-sound.mp3
        if (currentSession === 0) {
          playSound(sndAirplane); // belum di-increment, artinya sesi 1
        } else {
          playSound(sndClock);
        }
        _startWork();
      };

      finishWork = function () {
        const wasWork = state === "work";
        _finishWork();
        if (wasWork && state === "break") playSound(sndClock);
      };

      brkOver = function () {
        playSound(sndClock);
        _brkOver();
      };

      // Re-patch finishBreak to use new brkOver
      finishBreak = function () {
        if (state !== "break") return;
        clearInterval(tickId);
        brkOver();
      };

      // =============================================
      // LOCALSTORAGE — persist sessions, totalWork, totalBreak
      // =============================================
      const LS_KEY_SESSIONS = 'fokuskuy_sessions';
      const LS_KEY_TOTALWORK = 'fokuskuy_totalWork';
      const LS_KEY_TOTALBREAK = 'fokuskuy_totalBreak';

      function saveToStorage() {
        try {
          localStorage.setItem(LS_KEY_SESSIONS, JSON.stringify(sessions));
          localStorage.setItem(LS_KEY_TOTALWORK, JSON.stringify(totalWork));
          localStorage.setItem(LS_KEY_TOTALBREAK, JSON.stringify(totalBreak));
        } catch (e) { /* silent */ }
      }

      function loadFromStorage() {
        try {
          const s = localStorage.getItem(LS_KEY_SESSIONS);
          const w = localStorage.getItem(LS_KEY_TOTALWORK);
          const b = localStorage.getItem(LS_KEY_TOTALBREAK);
          if (s !== null) sessions = JSON.parse(s);
          if (w !== null) totalWork = JSON.parse(w);
          if (b !== null) totalBreak = JSON.parse(b);
        } catch (e) { /* corrupted — start fresh */ }
      }

      function clearStorage() {
        try {
          localStorage.removeItem(LS_KEY_SESSIONS);
          localStorage.removeItem(LS_KEY_TOTALWORK);
          localStorage.removeItem(LS_KEY_TOTALBREAK);
        } catch (e) { /* silent */ }
      }

      // Patch finishWork to save after successful execution
      const _finishWorkLS = finishWork;
      finishWork = function () {
        const prevState = state;
        _finishWorkLS();
        if (prevState === 'work') saveToStorage();
      };

      // Patch resetAll to clear storage
      const _resetAllLS = resetAll;
      resetAll = function () {
        _resetAllLS();
        clearStorage();
      };

      // Load saved data and show mode menu
      loadFromStorage();
      updateMenuStats();
      setMotivasi(M_IDLE);
    </script>
  </body>
</html>
